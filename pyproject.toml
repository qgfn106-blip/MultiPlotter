[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multiplotter"
version = "0.3.0"
description = "统一的二维/三维科研绘图包：写一次初始化设置，之后只给数据"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = [
    "matplotlib",
    "plotting",
    "visualization",
    "scientific-computing",
    "3d",
    "animation",
    "subplots",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]

# ----------------------------------------------------------------------
# 运行依赖
# ----------------------------------------------------------------------
# 核心运行依赖只有两个：数据容器 + 绘图后端。
#
# 版本下限的来历：
#   numpy >= 1.21   —— 使用 numpy.typing 与 np.random.default_rng
#   matplotlib >= 3.5 —— 见 multiplotter/compat.py 的 MATPLOTLIB_MIN
#
# 上限不写死：compat.py 会在运行期检测版本差异并自动降级，
# 所以新版 matplotlib 可以直接装。
dependencies = [
    "numpy>=1.21",
    "matplotlib>=3.5",
]

# ----------------------------------------------------------------------
# 可选依赖
# ----------------------------------------------------------------------
[project.optional-dependencies]
# 保存 .gif 动画（matplotlib 的 pillow writer）
gif = ["pillow>=9.0"]

# 把 pandas.DataFrame 直接当表格数据传
pandas = ["pandas>=1.3"]

# 用 JAX 生成数据（示例与性能测试会用到）
jax = ["jax>=0.4", "jaxlib>=0.4"]

# 一次装齐所有可选功能
all = [
    "pillow>=9.0",
    "pandas>=1.3",
]

# 开发依赖：测试 + 文档校验
dev = [
    "pillow>=9.0",
    "pandas>=1.3",
    "pytest>=7.0",
]

# 文档与图片生成（tests/generate_*.py 需要的额外依赖）
docs = [
    "pillow>=9.0",
    "pandas>=1.3",
]

# ----------------------------------------------------------------------
# 打包
# ----------------------------------------------------------------------
[tool.setuptools]
# 真正的实现都在 multiplotter/ 包里；
# 根目录的 Multiplotter.py 是兼容旧写法的转发模块，作为 py-module 一起发布。
py-modules = ["Multiplotter"]

[tool.setuptools.packages.find]
include = ["multiplotter*"]
exclude = ["tests*", "examples*", "_split*"]

# ----------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py", "test_*.py"]
python_functions = ["test_*"]
# tests/ 下的脚本既能直接运行（python tests/xxx_test.py），
# 也能被 pytest 收集，所以把包根目录加进 pythonpath。
pythonpath = ["."]
filterwarnings = [
    # 直接运行测试脚本时 matplotlib 会对未渲染的 Animation 发警告，
    # 这是测试写法导致的，与库本身无关。
    "ignore:Animation was deleted without rendering anything:UserWarning",
    "ignore:constrained_layout not applied:UserWarning",
]

# ----------------------------------------------------------------------
# 其他工具
# ----------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    # 中文注释/文档里全角标点较多，不强制行长
    "E501",
]
